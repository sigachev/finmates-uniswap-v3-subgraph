version: '3'
services:
  graph-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8020:8020"
      - "8030:8030"
      - "8001:8001"
      - "8040:8040"
    depends_on:
      - ipfs
      - postgres
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: ipfs:5001
      ethereum: arbitrum-one:http://arbitrum-rpc.finmates.com  # Changed to HTTP
      GRAPH_LOG: info

  ipfs:
    image: ipfs/go-ipfs:v0.10.0
    ports:
      - "5001:5001"
    volumes:
      - ./data/ipfs:/data/ipfs

  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data