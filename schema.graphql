# Uniswap V3 Subgraph Schema with Tick Analytics
# Built-in scalar types: ID, String, Boolean, Int, BigInt, BigDecimal, Bytes

type Factory @entity(immutable: false) {
  # factory address
  id: ID!
  # amount of pools created
  poolCount: BigInt!
  # amount of transactions all time
  txCount: BigInt!
  # total volume all time in derived USD
  totalVolumeUSD: BigDecimal!
  # total volume all time in derived ETH
  totalVolumeETH: BigDecimal!
  # total swap fees all time in USD
  totalFeesUSD: BigDecimal!
  # total swap fees all time in ETH
  totalFeesETH: BigDecimal!
  # all volume even through less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # TVL derived in USD
  totalValueLockedUSD: BigDecimal!
  # TVL derived in ETH
  totalValueLockedETH: BigDecimal!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # TVL derived in ETH untracked
  totalValueLockedETHUntracked: BigDecimal!
  # current owner of the factory
  owner: ID!
}

# stores for USD calculations
type Bundle @entity(immutable: false) {
  id: ID!
  # price of ETH in usd
  ethPriceUSD: BigDecimal!
}

type Token @entity(immutable: false) {
  # token address
  id: ID!
  # token symbol
  symbol: String!
  # token name
  name: String!
  # token decimals
  decimals: BigInt!
  # token total supply
  totalSupply: BigInt!
  # volume in token units
  volume: BigDecimal!
  # volume in derived USD
  volumeUSD: BigDecimal!
  # volume in USD even on pools with less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # transactions across all pools that include this token
  txCount: BigInt!
  # number of pools containing this token
  poolCount: BigInt!
  # liquidity across all pools in token units
  totalValueLocked: BigDecimal!
  # liquidity across all pools in derived USD
  totalValueLockedUSD: BigDecimal!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # derived price in ETH
  derivedETH: BigDecimal!
  # pools token is in that are white listed for USD pricing
  whitelistPools: [Pool!]!
  # derived fields
  tokenDayData: [TokenDayData!]! @derivedFrom(field: "token")
}

type Pool @entity(immutable: false) {
  # pool address
  id: ID!
  # creation
  createdAtTimestamp: BigInt!
  # block pool was created at
  createdAtBlockNumber: BigInt!
  # token0
  token0: Token!
  # token1
  token1: Token!
  # fee amount
  feeTier: BigInt!
  # in range liquidity
  liquidity: BigInt!
  # current price tracker
  sqrtPrice: BigInt!
  # tracker for global fee growth
  feeGrowthGlobal0X128: BigInt!
  # tracker for global fee growth
  feeGrowthGlobal1X128: BigInt!
  # token0 per token1
  token0Price: BigDecimal!
  # token1 per token0
  token1Price: BigDecimal!
  # current tick
  tick: BigInt
  # current observation index
  observationIndex: BigInt!
  # all time token0 swapped
  volumeToken0: BigDecimal!
  # all time token1 swapped
  volumeToken1: BigDecimal!
  # all time USD swapped
  volumeUSD: BigDecimal!
  # all time USD swapped, unfiltered for unreliable USD pools
  untrackedVolumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # all time number of transactions
  txCount: BigInt!
  # all time fees collected token0
  collectedFeesToken0: BigDecimal!
  # all time fees collected token1
  collectedFeesToken1: BigDecimal!
  # all time fees collected derived USD
  collectedFeesUSD: BigDecimal!
  # total token 0 across all ticks
  totalValueLockedToken0: BigDecimal!
  # total token 1 across all ticks
  totalValueLockedToken1: BigDecimal!
  # tvl derived ETH
  totalValueLockedETH: BigDecimal!
  # tvl USD
  totalValueLockedUSD: BigDecimal!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # Fields used to help derived relationship
  liquidityProviderCount: BigInt! # used to detect new exchanges
  # hourly snapshots of pool data
  poolHourData: [PoolHourData!]! @derivedFrom(field: "pool")
  # daily snapshots of pool data
  poolDayData: [PoolDayData!]! @derivedFrom(field: "pool")
  # derived fields
  mints: [Mint!]! @derivedFrom(field: "pool")
  burns: [Burn!]! @derivedFrom(field: "pool")
  swaps: [Swap!]! @derivedFrom(field: "pool")
  collects: [Collect!]! @derivedFrom(field: "pool")
  ticks: [Tick!]! @derivedFrom(field: "pool")
}

type Tick @entity(immutable: false) {
  # format: <pool address>#<tick index>
  id: ID!
  # pool address
  poolAddress: String
  # tick index
  tickIdx: BigInt!
  # pointer to pool
  pool: Pool!
  # total liquidity pool has as tick lower or upper
  liquidityGross: BigInt!
  # how much liquidity changes when tick crossed
  liquidityNet: BigInt!
  # calculated price of token0 of tick within this pool - constant
  price0: BigDecimal!
  # calculated price of token1 of tick within this pool - constant
  price1: BigDecimal!
  # lifetime volume of token0 with this tick in range
  volumeToken0: BigDecimal!
  # lifetime volume of token1 with this tick in range
  volumeToken1: BigDecimal!
  # lifetime volume in derived USD with this tick in range
  volumeUSD: BigDecimal!
  # lifetime volume in untracked USD with this tick in range
  untrackedVolumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # all time collected fees in token0
  collectedFeesToken0: BigDecimal!
  # all time collected fees in token1
  collectedFeesToken1: BigDecimal!
  # all time collected fees in USD
  collectedFeesUSD: BigDecimal!
  # created time
  createdAtTimestamp: BigInt!
  # created block
  createdAtBlockNumber: BigInt!
  # Fields used to help derived relationship
  liquidityProviderCount: BigInt! # used to detect new exchanges
  # vars needed for fee computation
  feeGrowthOutside0X128: BigInt!
  feeGrowthOutside1X128: BigInt!
}

type Position @entity(immutable: false) {
  # Positions created through NonfungiblePositionManager
  # NFT token id
  id: ID!
  # owner of the NFT
  owner: Bytes!
  # pool position is within
  pool: Pool!
  # allow indexing by tokens
  token0: Token!
  # allow indexing by tokens
  token1: Token!
  # lower tick of the position
  tickLower: Tick!
  # upper tick of the position
  tickUpper: Tick!
  # total position liquidity
  liquidity: BigInt!
  # amount of token 0 ever deposited to position
  depositedToken0: BigDecimal!
  # amount of token 1 ever deposited to position
  depositedToken1: BigDecimal!
  # amount of token 0 ever withdrawn from position (without fees)
  withdrawnToken0: BigDecimal!
  # amount of token 1 ever withdrawn from position (without fees)
  withdrawnToken1: BigDecimal!
  # all time collected token0 (withdrawnToken0 + collectedFeesToken0)
  collectedToken0: BigDecimal!
  # all time collected token1 (withdrawnToken1 + collectedFeesToken1)
  collectedToken1: BigDecimal!
  # all time collected fees in token0
  collectedFeesToken0: BigDecimal!
  # all time collected fees in token1
  collectedFeesToken1: BigDecimal!
  # tx in which the position was initialized
  transaction: Transaction!
  # vars needed for fee computation
  feeGrowthInside0LastX128: BigInt!
  feeGrowthInside1LastX128: BigInt!
}

type PositionSnapshot @entity(immutable: false) {
  # <NFT token id>#<block number>
  id: ID!
  # owner of the NFT
  owner: Bytes!
  # pool the position is within
  pool: Pool!
  # position of which the snap was taken of
  position: Position!
  # block in which the snap was created
  blockNumber: BigInt!
  # timestamp of block in which the snap was created
  timestamp: BigInt!
  # total position liquidity
  liquidity: BigInt!
  # amount of token 0 ever deposited to position
  depositedToken0: BigDecimal!
  # amount of token 1 ever deposited to position
  depositedToken1: BigDecimal!
  # amount of token 0 ever withdrawn from position (without fees)
  withdrawnToken0: BigDecimal!
  # amount of token 1 ever withdrawn from position (without fees)
  withdrawnToken1: BigDecimal!
  # all time collected fees in token0
  collectedFeesToken0: BigDecimal!
  # all time collected fees in token1
  collectedFeesToken1: BigDecimal!
  # tx in which the snapshot was initialized
  transaction: Transaction!
  # internal vars needed for fee computation
  feeGrowthInside0LastX128: BigInt!
  feeGrowthInside1LastX128: BigInt!
}

type Transaction @entity(immutable: true) {
  # txn hash
  id: ID!
  # block txn was included in
  blockNumber: BigInt!
  # timestamp txn was confirmed
  timestamp: BigInt!
  # gas used during txn execution
  gasUsed: BigInt!
  gasPrice: BigInt!
  # derived values
  mints: [Mint!]! @derivedFrom(field: "transaction")
  burns: [Burn!]! @derivedFrom(field: "transaction")
  swaps: [Swap!]! @derivedFrom(field: "transaction")
  flashed: [Flash!]! @derivedFrom(field: "transaction")
  collects: [Collect!]! @derivedFrom(field: "transaction")
}

type Mint @entity(immutable: true) {
  # transaction hash + "#" + index in mints Transaction array
  id: ID!
  # which txn the mint was included in
  transaction: Transaction!
  # time of txn
  timestamp: BigInt!
  # pool position is within
  pool: Pool!
  # allow indexing by tokens
  token0: Token!
  # allow indexing by tokens
  token1: Token!
  # owner of position where liquidity minted to
  owner: Bytes!
  # the address that minted the liquidity
  sender: Bytes
  # txn origin
  origin: Bytes! # the EOA that initiated the txn
  # amount of liquidity minted
  amount: BigInt!
  # amount of token 0 minted
  amount0: BigDecimal!
  # amount of token 1 minted
  amount1: BigDecimal!
  # derived amount based on available prices of tokens
  amountUSD: BigDecimal
  # lower tick of the position
  tickLower: BigInt!
  # upper tick of the position
  tickUpper: BigInt!
  # order within the txn
  logIndex: BigInt
}

type Burn @entity(immutable: true) {
  # transaction hash + "#" + index in mints Transaction array
  id: ID!
  # txn burn was included in
  transaction: Transaction!
  # pool position is within
  pool: Pool!
  # allow indexing by tokens
  token0: Token!
  # allow indexing by tokens
  token1: Token!
  # need this to pull recent txns for specific token or pool
  timestamp: BigInt!
  # owner of position where liquidity was burned
  owner: Bytes
  # txn origin
  origin: Bytes! # the EOA that initiated the txn
  # amount of liquidity burned
  amount: BigInt!
  # amount of token 0 burned
  amount0: BigDecimal!
  # amount of token 1 burned
  amount1: BigDecimal!
  # derived amount based on available prices of tokens
  amountUSD: BigDecimal
  # lower tick of position
  tickLower: BigInt!
  # upper tick of position
  tickUpper: BigInt!
  # position within the transactions
  logIndex: BigInt
}

type Swap @entity(immutable: true) {
  # transaction hash + "#" + index in swaps Transaction array
  id: ID!
  # pointer to transaction
  transaction: Transaction!
  # timestamp of transaction
  timestamp: BigInt!
  # pool swap occured within
  pool: Pool!
  # allow indexing by tokens
  token0: Token!
  # allow indexing by tokens
  token1: Token!
  # sender of the swap
  sender: Bytes!
  # recipient of the swap
  recipient: Bytes!
  # txn origin
  origin: Bytes! # the EOA that initiated the txn
  # delta of token0 swapped
  amount0: BigDecimal!
  # delta of token1 swapped
  amount1: BigDecimal!
  # derived info
  amountUSD: BigDecimal!
  # The sqrt(price) of the pool after the swap, as a Q64.96
  sqrtPriceX96: BigInt!
  # the tick after the swap
  tick: BigInt!
  # index within the txn
  logIndex: BigInt
}

type Collect @entity(immutable: true) {
  # transaction hash + "#" + index in collect Transaction array
  id: ID!
  # pointer to txn
  transaction: Transaction!
  # timestamp of event
  timestamp: BigInt!
  # pool collect occured within
  pool: Pool!
  # owner of position collect was performed on
  owner: Bytes
  # amount of token0 collected
  amount0: BigDecimal!
  # amount of token1 collected
  amount1: BigDecimal!
  # derived amount based on available prices of tokens
  amountUSD: BigDecimal
  # lower tick of position
  tickLower: BigInt!
  # upper tick of position
  tickUpper: BigInt!
  # index within the txn
  logIndex: BigInt
}

type Flash @entity(immutable: true) {
  # transaction hash + "-" + index in collect Transaction array
  id: ID!
  # pointer to txn
  transaction: Transaction!
  # timestamp of event
  timestamp: BigInt!
  # pool collect occured within
  pool: Pool!
  # sender of the flash
  sender: Bytes!
  # recipient of the flash
  recipient: Bytes!
  # amount of token0 flashed
  amount0: BigDecimal!
  # amount of token1 flashed
  amount1: BigDecimal!
  # derived amount based on available prices of tokens
  amountUSD: BigDecimal!
  # amount token0 paid for flash
  amount0Paid: BigDecimal!
  # amount token1 paid for flash
  amount1Paid: BigDecimal!
  # index within the txn
  logIndex: BigInt
}


# ============================================================================
# MintContext - Links Pool Mint events with NFT Position IncreaseLiquidity
# This enables event-only position creation without eth_call operations
# ============================================================================
type MintContext @entity(immutable: true) {
  # Unique ID: transaction hash + "-" + log index
  id: ID!

  # Pool address that emitted the Mint event
  pool: String!

  # Lower tick of the position
  tickLower: Int!

  # Upper tick of the position
  tickUpper: Int!

  # Owner address from Mint event
  owner: Bytes!

  # Timestamp of the Mint event
  timestamp: BigInt!

  # Transaction hash
  transaction: String!

  # Log index within transaction
  logIndex: BigInt!
}


# Data accumulated and condensed into day stats for all of Uniswap
type UniswapDayData @entity(immutable: false) {
  # timestamp rounded to current day by dividing by 86400
  id: ID!
  # timestamp rounded to current day by dividing by 86400
  date: Int!
  # total daily volume in Uniswap derived in terms of ETH
  volumeETH: BigDecimal!
  # total daily volume in Uniswap derived in terms of USD
  volumeUSD: BigDecimal!
  # total daily volume in Uniswap derived in terms of USD untracked
  volumeUSDUntracked: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # number of daily transactions
  txCount: BigInt!
  # tvl in terms of USD
  tvlUSD: BigDecimal!
}

# Data accumulated and condensed into day stats for each pool
type PoolDayData @entity(immutable: false) {
  # timestamp rounded to current day by dividing by 86400
  id: ID!
  # timestamp rounded to current day by dividing by 86400
  date: Int!
  # pointer to pool
  pool: Pool!
  # in range liquidity at end of period
  liquidity: BigInt!
  # current price tracker at end of period
  sqrtPrice: BigInt!
  # price of token0 - derived from sqrtPrice
  token0Price: BigDecimal!
  # price of token1 - derived from sqrtPrice
  token1Price: BigDecimal!
  # current tick at end of period
  tick: BigInt
  # tracker for global fee growth
  feeGrowthGlobal0X128: BigInt!
  # tracker for global fee growth
  feeGrowthGlobal1X128: BigInt!
  # tvl derived in USD at end of period
  tvlUSD: BigDecimal!
  # volume in token0
  volumeToken0: BigDecimal!
  # volume in token1
  volumeToken1: BigDecimal!
  # volume in USD
  volumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # number of transactions during period
  txCount: BigInt!
  # opening price of token0
  open: BigDecimal!
  # high price of token0
  high: BigDecimal!
  # low price of token0
  low: BigDecimal!
  # close price of token0
  close: BigDecimal!
}

# hourly stats tracker for pool
type PoolHourData @entity(immutable: false) {
  # format: <pool address>-<timestamp>
  id: ID!
  # unix timestamp for start of hour
  periodStartUnix: Int!
  # pointer to pool
  pool: Pool!
  # in range liquidity at end of period
  liquidity: BigInt!
  # current price tracker at end of period
  sqrtPrice: BigInt!
  # price of token0 - derived from sqrtPrice
  token0Price: BigDecimal!
  # price of token1 - derived from sqrtPrice
  token1Price: BigDecimal!
  # current tick at end of period
  tick: BigInt
  # tracker for global fee growth
  feeGrowthGlobal0X128: BigInt!
  # tracker for global fee growth
  feeGrowthGlobal1X128: BigInt!
  # tvl derived in USD at end of period
  tvlUSD: BigDecimal!
  # volume in token0
  volumeToken0: BigDecimal!
  # volume in token1
  volumeToken1: BigDecimal!
  # volume in USD
  volumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # number of transactions during period
  txCount: BigInt!
  # opening price of token0
  open: BigDecimal!
  # high price of token0
  high: BigDecimal!
  # low price of token0
  low: BigDecimal!
  # close price of token0
  close: BigDecimal!
}

type TickHourData @entity(immutable: false) {
  # format: <pool address>-<tick index>-<timestamp>
  id: ID!
  # unix timestamp for start of hour
  periodStartUnix: Int!
  # pointer to pool
  pool: Pool!
  # pointer to tick
  tick: Tick!
  # total liquidity pool has as tick lower or upper at end of period
  liquidityGross: BigInt!
  # how much liquidity changes when tick crossed at end of period
  liquidityNet: BigInt!
  # hourly volume of token0 with this tick in range
  volumeToken0: BigDecimal!
  # hourly volume of token1 with this tick in range
  volumeToken1: BigDecimal!
  # hourly volume in derived USD with this tick in range
  volumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
}

# Data accumulated and condensed into day stats for each exchange
# Note: this entity gets saved only if there is a change during the day
type TickDayData @entity(immutable: false) {
  # format: <pool address>-<tick index>-<timestamp>
  id: ID!
  # timestamp rounded to current day by dividing by 86400
  date: Int!
  # pointer to pool
  pool: Pool!
  # pointer to tick
  tick: Tick!
  # total liquidity pool has as tick lower or upper at end of period
  liquidityGross: BigInt!
  # how much liquidity changes when tick crossed at end of period
  liquidityNet: BigInt!
  # hourly volume of token0 with this tick in range
  volumeToken0: BigDecimal!
  # hourly volume of token1 with this tick in range
  volumeToken1: BigDecimal!
  # hourly volume in derived USD with this tick in range
  volumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # vars needed for fee computation
  feeGrowthOutside0X128: BigInt!
  feeGrowthOutside1X128: BigInt!
}

type TokenDayData @entity(immutable: false) {
  # token address concatenated with date
  id: ID!
  # timestamp rounded to current day by dividing by 86400
  date: Int!
  # pointer to token
  token: Token!
  # volume in token units
  volume: BigDecimal!
  # volume in derived USD
  volumeUSD: BigDecimal!
  # volume in USD even on pools with less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # liquidity across all pools in token units
  totalValueLocked: BigDecimal!
  # liquidity across all pools in derived USD
  totalValueLockedUSD: BigDecimal!
  # price at end of period in USD
  priceUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # opening price USD
  open: BigDecimal!
  # high price USD
  high: BigDecimal!
  # low price USD
  low: BigDecimal!
  # close price USD
  close: BigDecimal!
}

type TokenHourData @entity(immutable: false) {
  # token address concatenated with date
  id: ID!
  # unix timestamp for start of hour
  periodStartUnix: Int!
  # pointer to token
  token: Token!
  # volume in token units
  volume: BigDecimal!
  # volume in derived USD
  volumeUSD: BigDecimal!
  # volume in USD even on pools with less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # liquidity across all pools in token units
  totalValueLocked: BigDecimal!
  # liquidity across all pools in derived USD
  totalValueLockedUSD: BigDecimal!
  # price at end of period in USD
  priceUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # opening price USD
  open: BigDecimal!
  # high price USD
  high: BigDecimal!
  # low price USD
  low: BigDecimal!
  # close price USD
  close: BigDecimal!
}


# ============================================
# TICK ACTIVITY ANALYTICS - 8 TIMEFRAMES
# ============================================

"""
Track per-tick crossing activity with 8 timeframes (1h, 3h, 6h, 12h, 24h, 3d, 7d, 30d)
"""
type TickActivity @entity(immutable: false) {
  " Format: {poolAddress}-{tickIndex} "
  id: ID!

  " Reference to the pool "
  pool: Pool!

  " Tick index "
  tickIdx: BigInt!

  " Approximate price at this tick (token1/token0) "
  price: BigDecimal!

  " Hit counters for different timeframes "
  hits1h: BigInt!
  hits3h: BigInt!
  hits6h: BigInt!
  hits12h: BigInt!
  hits24h: BigInt!
  hits3d: BigInt!
  hits7d: BigInt!
  hits30d: BigInt!

  " Volume counters (in token0) "
  volume1h: BigDecimal!
  volume3h: BigDecimal!
  volume6h: BigDecimal!
  volume12h: BigDecimal!
  volume24h: BigDecimal!
  volume3d: BigDecimal!
  volume7d: BigDecimal!
  volume30d: BigDecimal!

  " Liquidity changes "
  liquidityAdded: BigInt!
  liquidityRemoved: BigInt!

  " Fees collected "
  feesCollected: BigDecimal!

  " Last update timestamp "
  lastUpdateTimestamp: BigInt!
}

"""
Track most active ticks globally across different timeframes
"""
type GlobalTickRanking @entity(immutable: false) {
  " Format: {timeframe}-{rank} e.g. '1h-1', '24h-5' "
  id: ID!

  " Timeframe identifier "
  timeframe: String!

  " Rank position (1-100) "
  rank: Int!

  " Reference to TickActivity "
  tickActivity: TickActivity!

  " Hit count at time of ranking "
  hitCount: BigInt!

  " Volume at time of ranking "
  volume: BigDecimal!

  " Timestamp of ranking "
  timestamp: BigInt!
}

"""
Track tick crossings per pool across timeframes
"""
type PoolTickActivity @entity(immutable: false) {
  " Format: {poolAddress} "
  id: ID!

  " Reference to pool "
  pool: Pool!

  " Total unique ticks crossed "
  totalTicksCrossed: BigInt!

  " Count of crossings per timeframe "
  count1h: BigInt!
  count3h: BigInt!
  count6h: BigInt!
  count12h: BigInt!
  count24h: BigInt!
  count3d: BigInt!
  count7d: BigInt!
  count30d: BigInt!

  " Last update "
  lastUpdateTimestamp: BigInt!
}


# ============================================
# TICK RANGE ANALYTICS - MERGED & ENHANCED
# ============================================

"""
Track specific tick ranges where positions concentrate
Combines simple position tracking with advanced analytics
"""
type TickRange @entity(immutable: false) {
  " Format: {poolAddress}-{lowerTick}-{upperTick} "
  id: ID!

  # Reference data
  pool: Pool!
  lowerTick: BigInt!
  upperTick: BigInt!

  # Price range boundaries
  priceLower: BigDecimal!  # token0 price at lower tick
  priceUpper: BigDecimal!  # token0 price at upper tick
  priceCurrent: BigDecimal! # current token0 price in pool

  # Liquidity metrics
  liquidityActive: BigInt!     # Liquidity currently active in this range
  totalLiquidity: BigInt!      # Total liquidity (active + inactive positions)
  liquidityUSD: BigDecimal!    # USD value of liquidity in range
  activePositions: BigInt!     # Number of active positions in this range
  avgLiquidityPerPosition: BigDecimal!

  # Volume metrics (lifetime)
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!
  volumeUSD: BigDecimal!

  # Fee metrics (lifetime)
  totalFeesCollected: BigDecimal!
  feesToken0: BigDecimal!
  feesToken1: BigDecimal!

  # Performance metrics
  feeAPR24h: BigDecimal!
  feeAPR7d: BigDecimal!
  volumeToLiquidityRatio24h: BigDecimal!

  # Activity metrics
  crossingCount: BigInt!       # Number of times this range was crossed

  # Time-series snapshots
  rangeHourData: [TickRangeHourData!]! @derivedFrom(field: "tickRange")
  rangeDayData: [TickRangeDayData!]! @derivedFrom(field: "tickRange")

  # Status flags
  isInRange: Boolean!          # Is current price within this range?
  lastUpdateTimestamp: BigInt!
  lastUpdateBlock: BigInt!
}

# Hourly snapshots of tick range data
type TickRangeHourData @entity(immutable: false) {
  # <pool>-<lowerTick>-<upperTick>-<hourTimestamp>
  id: ID!
  periodStartUnix: Int!
  tickRange: TickRange!
  pool: Pool!

  # Liquidity at hour end
  liquidityActive: BigInt!
  liquidityUSD: BigDecimal!
  positionCount: BigInt!

  # Volume during hour
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!
  volumeUSD: BigDecimal!

  # Fees during hour
  feesUSD: BigDecimal!
  feesToken0: BigDecimal!
  feesToken1: BigDecimal!

  # Derived metrics
  feeAPR: BigDecimal!
  volumeToLiquidityRatio: BigDecimal!

  # Number of swaps that utilized this range
  swapCount: BigInt!

  # Was price in range during this hour?
  priceInRange: Boolean!
  avgPrice: BigDecimal!
}

# Daily snapshots of tick range data
type TickRangeDayData @entity(immutable: false) {
  # <pool>-<lowerTick>-<upperTick>-<dayTimestamp>
  id: ID!
  date: Int!
  tickRange: TickRange!
  pool: Pool!

  # Liquidity metrics
  liquidityActive: BigInt!
  liquidityUSD: BigDecimal!
  avgLiquidityUSD: BigDecimal!  # Time-weighted average
  positionCount: BigInt!

  # Volume metrics
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!
  volumeUSD: BigDecimal!

  # Fee metrics
  feesUSD: BigDecimal!
  feesToken0: BigDecimal!
  feesToken1: BigDecimal!

  # Performance metrics
  feeAPR: BigDecimal!
  volumeToLiquidityRatio: BigDecimal!

  # Activity metrics
  swapCount: BigInt!
  hoursInRange: Int!           # How many hours was price in this range?
  utilizationRate: BigDecimal! # hoursInRange / 24

  # Price metrics
  avgPrice: BigDecimal!
  highPrice: BigDecimal!
  lowPrice: BigDecimal!
}

# Predefined popular tick ranges for easy querying
type PopularTickRange @entity(immutable: false) {
  # <pool>-<rangeSize>-<centerTick>
  id: ID!
  pool: Pool!

  # Range definition
  rangeType: String!          # "narrow", "medium", "wide", "full"
  tickSpacing: Int!           # Based on pool fee tier
  lowerTick: Int!
  upperTick: Int!
  centerTick: Int!

  # Price range
  priceLower: BigDecimal!
  priceUpper: BigDecimal!
  priceCenter: BigDecimal!
  priceRangePercent: BigDecimal!  # % price can move within range

  # Aggregated metrics
  totalLiquidityUSD: BigDecimal!
  volume24h: BigDecimal!
  fees24h: BigDecimal!
  feeAPR24h: BigDecimal!

  # Risk metrics
  impermanentLossRisk: BigDecimal!  # Estimated IL based on price volatility

  lastUpdate: BigInt!
}

# Track the most profitable ranges for ranking
type RangeProfitabilityRanking @entity(immutable: false) {
  # <pool>-<timeframe>-<timestamp>
  id: ID!
  pool: Pool!
  timestamp: BigInt!
  timeframe: String!  # "1h", "24h", "7d"

  # Top ranges by different metrics
  topByFeeAPR: [TickRange!]!
  topByVolume: [TickRange!]!
  topByLiquidity: [TickRange!]!
  topByEfficiency: [TickRange!]!  # volume/liquidity ratio

  # Scores for each range
  feeAPRScores: [BigDecimal!]!
  volumeScores: [BigDecimal!]!
  liquidityScores: [BigDecimal!]!
  efficiencyScores: [BigDecimal!]!
  compositeScores: [BigDecimal!]!
}

# Optimal range suggestions based on current market conditions
type OptimalRangeSuggestion @entity(immutable: false) {
  # <pool>-<strategy>-<timestamp>
  id: ID!
  pool: Pool!
  strategy: String!  # "conservative", "moderate", "aggressive"
  timestamp: BigInt!

  # Suggested range
  suggestedLowerTick: Int!
  suggestedUpperTick: Int!
  suggestedPriceLower: BigDecimal!
  suggestedPriceUpper: BigDecimal!

  # Expected performance
  expectedFeeAPR: BigDecimal!
  expectedVolume24h: BigDecimal!
  confidenceScore: BigDecimal!  # 0-100

  # Risk assessment
  impermanentLossRisk: String!  # "low", "medium", "high"
  priceVolatility: BigDecimal!

  # Supporting data
  historicalFeeAPR7d: BigDecimal!
  historicalFeeAPR30d: BigDecimal!
  competingLiquidityUSD: BigDecimal!

  # Reasoning
  reason: String!
}

# Liquidity density heatmap data
type LiquidityDistribution @entity(immutable: false) {
  # <pool>-<timestamp>
  id: ID!
  pool: Pool!
  timestamp: BigInt!
  currentTick: BigInt!
  currentPrice: BigDecimal!

  # Distribution bins (percentages from current price)
  # Each array has 20 bins: -50% to +50% in 5% increments
  tickRanges: [Int!]!
  liquidityAmounts: [BigInt!]!
  liquidityUSD: [BigDecimal!]!
  positionCounts: [Int!]!

  # Concentration metrics
  liquidityConcentration: BigDecimal!  # Gini coefficient
  topRangesLiquidityShare: BigDecimal! # Top 20% ranges hold what % of liquidity
}